
name: Crear instalador Nova PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit

      - name: Crear instalador
        run: npm run dist

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Nova-PC-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
